<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The hero is a card floating on the paper now, not a field running off the top, so the
      browser chrome matches the *page* — white in the light, Wise's near-black in the dark.
      One `theme-color` cannot say both, and a chrome in the card's forest over a white page
      read as a slab someone forgot to finish.
    -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121511" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <!-- Stated twice on purpose: the Worker sets the same policy as a header on every asset,
         and this copy survives in a saved page or a cache the header never reached. Inline
         styles are real — the stylesheet below and the style="--fit:…" sizing attributes —
         hence 'unsafe-inline' for styles only; scripts stay 'self'. connect-src 'self' also
         means a dev page on :5173 cannot talk to a worker on :8787 — run against the built
         assets served by the Worker instead. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons; without this the Home Screen tile is a screenshot. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Blocking, and worth it: the whole page is figures, and a fallback face swapping out from
         under a Toman total is the one reflow that changes what the number looks like. -->
    <link rel="preload" href="/modam.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Web Push on iOS only works once this is on the Home Screen, so say so in the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>چقدر تومن</title>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
