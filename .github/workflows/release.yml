name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Create disposable CI signing config
        run: |
          umask 077
          keytool -genkeypair -noprompt \
            -keystore ci-test.jks -storepass ci-test-password -keypass ci-test-password \
            -alias ci-test -dname "CN=CI" -keyalg RSA -keysize 2048 -validity 1
          cat > keystore.properties <<EOF
          storeFile=ci-test.jks
          storePassword=ci-test-password
          keyAlias=ci-test
          keyPassword=ci-test-password
          EOF

      # No native code, so each APK covers every ABI. minSdk 24 = Android 7.0+.
      # assembleRelease builds both editions. Both test variants run, and only those two: plain
      # `test` would now run the same suite six times, while one variant alone could not check that
      # the lite flavour is configured as anything other than a second copy of the full app.
      - run: |
          ./gradlew testFullDebugUnitTest testLiteDebugUnitTest lint assembleRelease \
            -Pmuchtoman.versionName=${GITHUB_REF_NAME#v} \
            -Pmuchtoman.versionCode=${{ github.run_number }}

      # 1.0.2 shipped an APK that could not start. R8 shrank away the no-argument constructor
      # Room reflects on, so WorkManager's startup provider threw before the first frame — on
      # every device, every launch. Nothing caught it, because nothing here had ever RUN the
      # thing being published: unit tests are JVM-only and never load the app, and lint reads
      # source rather than R8's output. A release-only crash is invisible to both by
      # construction, and that is a class of bug, not one mistake.
      #
      # So: build the same minified release variant with a disposable key, open it, and refuse
      # to publish if it is not on screen afterwards. The real signing key never enters a job
      # that executes the emulator action.
      #
      # ponytail: one API level, because "the release build cannot start" reproduces on all of
      # them. Make it a matrix down to 24 the day a bug gets through that is specific to old
      # Android rather than to R8.
      # Without this the emulator falls back to software emulation: the first attempt took
      # six minutes to boot and then stopped answering adb altogether ("Failure calling
      # service settings: Broken pipe"), failing the release on a perfectly good APK. The
      # runner has /dev/kvm but its user is not in the kvm group, so hand it out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The release APK must actually open
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 30
          # AOSP, not google_apis: this asks "does the app start", and the lighter image
          # boots quicker. Nothing here touches a Google API — prices come over plain HTTPS.
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install -r app/build/outputs/apk/full/release/app-full-release.apk
            adb install -r app/build/outputs/apk/lite/release/app-lite-release.apk
            # -b all: plain `logcat -c` leaves the crash buffer alone, which is the one buffer
            # this step reads. `|| true` because clearing the security buffer is refused on
            # some images, and a non-zero exit there would fail the release over nothing.
            adb logcat -b all -c || true
            adb shell am start -W -n com.doxigo.muchtoman/.MainActivity
            sleep 20
            # Every line below is one whole command on one line, on purpose: this action does
            # not hand the block to a single shell. It splits on newlines and runs each line
            # through its own `sh -c`, so an `if` opened on one line and closed on the next is
            # two syntax errors rather than one conditional — which fails the step, and with it
            # the release, on a perfectly healthy build. (Lines starting with # are stripped by
            # the same parser, so comments are safe.)
            #
            # The crash buffer is the assertion: a process that died during startup leaves its
            # trace here even though `am start` already returned success.
            if adb logcat -d -b crash | grep -q "com.doxigo.muchtoman"; then echo "::error::the release APK crashed on launch"; adb logcat -d -b crash | tail -60; exit 1; fi
            # And it has to still be on screen, not a process that quietly went away.
            adb shell dumpsys activity activities | grep -q "com.doxigo.muchtoman/.MainActivity" || { echo "::error::the release APK never reached the foreground"; exit 1; }
            # Then the same two assertions for the lite edition, because it is its own R8 run:
            # the shrinker sees a different reachable set once the ledger screens are unreachable,
            # and "R8 removed something Room reflects on" is exactly the bug that got through in
            # 1.0.2. A build nothing has ever opened is a build nobody has checked.
            # Its class stays com.doxigo.muchtoman.MainActivity — only the applicationId moves —
            # so the component has to be spelled out in full here.
            adb logcat -b all -c || true
            adb shell am start -W -n com.doxigo.muchtoman.lite/com.doxigo.muchtoman.MainActivity
            sleep 20
            if adb logcat -d -b crash | grep -q "com.doxigo.muchtoman"; then echo "::error::the lite release APK crashed on launch"; adb logcat -d -b crash | tail -60; exit 1; fi
            adb shell dumpsys activity activities | grep -q "com.doxigo.muchtoman.lite/com.doxigo.muchtoman.MainActivity" || { echo "::error::the lite release APK never reached the foreground"; exit 1; }

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Full history + tags: the changelog is the commits since the previous tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Recreate signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > muchtoman-release.jks
          cat > keystore.properties <<EOF
          storeFile=muchtoman-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release
        run: |
          ./gradlew assembleRelease \
            -Pmuchtoman.versionName=${GITHUB_REF_NAME#v} \
            -Pmuchtoman.versionCode=${{ github.run_number }}

      - name: Remove signing material
        if: always()
        run: rm -f muchtoman-release.jks keystore.properties

      # The changelog is the commit subjects since the previous tag. GitHub's own
      # --generate-notes lists merged pull requests, and this repo commits straight to main,
      # so it would publish an empty release every time.
      #
      # Above it, between markers, goes the annotated tag's own message. That is the Persian
      # note the app shows on the update sheet to someone still running the old build, and it
      # lives on the tag rather than in a file in the repo for one reason: a file gets forgotten
      # and then describes the release before this one, which is worse than describing none. A
      # lightweight tag has no message, and the sheet then simply lists nothing.
      #
      #   git tag -a v1.0.5 -m 'سود بانکی رو دیگه اشتباه نمی‌خونه' && git push origin v1.0.5
      - name: Prepare release artifacts
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          : > notes.md
          fa=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "${GITHUB_REF_NAME}")
          if [ -n "$(printf '%s' "$fa" | tr -d '[:space:]')" ]; then
            { echo '<!--fa-->'; printf '%s\n' "$fa"; echo '<!--/fa-->'; echo; } >> notes.md
          fi
          echo "## Changes" >> notes.md
          git log --no-merges --reverse --pretty='- %s' "${prev:+$prev..}${GITHUB_REF_NAME}" >> notes.md
          if [ -n "$prev" ]; then
            echo >> notes.md
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME" >> notes.md
          fi
          cat notes.md

          mv app/build/outputs/apk/full/release/app-full-release.apk \
             muchtoman-${GITHUB_REF_NAME}.apk
          # The lite edition keeps the suffix in its filename and the full one keeps the plain
          # name, because the plain name is the link people already have.
          mv app/build/outputs/apk/lite/release/app-lite-release.apk \
             muchtoman-lite-${GITHUB_REF_NAME}.apk
          # R8 renames everything, so a stack trace off a real phone is unreadable without the
          # map for that exact build — and the build is gone the moment the runner is. Ship it
          # beside the APK: `retrace mapping.txt trace.txt` is then the whole of debugging a
          # crash someone photographs for you. Nothing secret in it; the source is right here.
          # One map per edition: two R8 runs, two different sets of renames, and the wrong map
          # decodes a trace into confident nonsense rather than failing.
          cp app/build/outputs/mapping/fullRelease/mapping.txt \
             muchtoman-${GITHUB_REF_NAME}-mapping.txt
          cp app/build/outputs/mapping/liteRelease/mapping.txt \
             muchtoman-lite-${GITHUB_REF_NAME}-mapping.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            muchtoman-${{ github.ref_name }}.apk
            muchtoman-${{ github.ref_name }}-mapping.txt
            muchtoman-lite-${{ github.ref_name }}.apk
            muchtoman-lite-${{ github.ref_name }}-mapping.txt
            notes.md
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
      - run: |
          gh release create "$GITHUB_REF_NAME" \
            "muchtoman-${GITHUB_REF_NAME}.apk" \
            "muchtoman-${GITHUB_REF_NAME}-mapping.txt" \
            "muchtoman-lite-${GITHUB_REF_NAME}.apk" \
            "muchtoman-lite-${GITHUB_REF_NAME}-mapping.txt" \
            --notes-file notes.md --title "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
