name: check

# The repo has only ever run CI on a tag, which means a broken main is discovered at release
# time. With a ledger, a sync Worker and a PWA in here, that is too late — so this runs on every
# push and every pull request. The tag workflow, emulator smoke test and all, is unchanged.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      # gradle.properties turns the configuration cache on, and this action discards it at the end
      # of every job unless it can encrypt it first (it can hold credentials). With the key, main
      # saves it and every run after starts from it. An unset secret reads as an empty key, which
      # the action treats as none: the run still passes, it just configures from scratch. Only
      # here, not in release.yml: a tag run is read-only, and its -P version properties could
      # never match an entry main wrote anyway.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}
      # Both editions, but only their debug variants: plain `test` would now run the same suite six
      # times over. Twice is not waste — EditionTest is the check that the lite flavour's
      # buildConfigField actually reached it, and it can only make that claim from inside the lite
      # variant. assembleDebug builds both so a lite-only compile error cannot wait until tag day.
      - name: Unit tests and lint
        run: ./gradlew testFullDebugUnitTest testLiteDebugUnitTest lint assembleDebug

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Rates Worker
        working-directory: worker
        run: npm ci && npm run check

  pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - name: PWA
        working-directory: pwa
        # Its tests read the golden corpus out of the Android module, so this is also the check
        # that the two parsers still agree on every case they share.
        run: npm ci --no-audit && npm run check
      - name: Hand the built assets to the sync job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pwa-dist
          path: pwa/dist
          retention-days: 1
          if-no-files-found: error
      # The browser download dwarfs the tests it runs; keep it out of every run. System deps are
      # not cached, which is why --with-deps stays on the install below.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pwa/package-lock.json') }}
      - name: Install browser
        working-directory: pwa
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        working-directory: pwa
        run: npm run test:browser

  sync:
    # The Worker's own build needs pwa/dist to exist. It arrives as the artifact the pwa job
    # already built and tested, instead of a second build whose output nothing had tested.
    needs: pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sync/package-lock.json
      - name: Fetch the PWA it serves
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pwa-dist
          path: pwa/dist
      - name: Sync Worker
        working-directory: sync
        # Real Durable Objects under workerd, not a mock: this is the first stateful thing in
        # the repo and it holds people's ledgers.
        run: npm ci && npm run check
