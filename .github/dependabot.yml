# Actions are SHA-pinned and the toolchain is version-catalogued; without this,
# both age silently — there is no other reminder to bump anything.
# Each entry groups its bumps into one PR, so a month is at most five, not a dozen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /sync
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /pwa
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
