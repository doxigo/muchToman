// Motion.settle / Motion.press: critically damped springs — nothing overshoots.
const spring = (W) => { const n = 1 - (1 + W) * Math.exp(-W); return (p) => (1 - (1 + W * p) * Math.exp(-W * p)) / n; };
const settle = spring(9), press = spring(13);

const $ = (s, r = document) => r.querySelector(s);

function words(el, text) {
  el.innerHTML = text.split('\n').map((line) => '<span class="ln">' + line.match(/\*[^*]+\*|[^\s*]+/g).map((tok) => {

  }).join(' ') + '</span>').join('');
  return $$('.wi', el);
}

  DOLLAR: ['#2F8544', '<path d="M12 2.6v18.8"/><path d="M16.6 5.9H9.8a3.3 3.3 0 0 0 0 6.6h4.4a3.3 3.3 0 0 1 0 6.6H6.9"/>'],
  CHART: ['#A33FBE', '<path d="M16 7h6v6"/><path d="M22 7l-8.5 8.5-5-5L2 17"/>'],
  HOUSE: ['#6E7526', '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'],
  WHEEL: ['#348030', '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>'],
};
const CRYPTO = { BTC: ['#F7931A', '₿', -14], USDT: ['#26A17B', '₮', 0] };

const stripDur = strips.map((_, i) => .56 + i * .036);

const PH = { w: 1130.89, h: 2450.89, b: 25.445, r: 163.98 };

const tl = gsap.timeline({ paused: true });
const clock = { t: 0 };

// A touch: appears just before its first tap, glides between taps, presses on each (Motion.press),
// leaves a ripple, and lifts away after the last unless the caller carries on with it.
function gesture(points, { el = '#t1', rip = '#r1', s = 1, leave = true } = {}) {
  const p0 = points[0];
  tl.fromTo(el, { x: p0.x + 40 * s, y: p0.y + 66 * s, scale: 1.3 * s, opacity: 0 }, { x: p0.x, y: p0.y, scale: s, opacity: 1, duration: .22, ease: settle, immediateRender: false }, T(p0.t - .24));
  points.forEach((p, i) => {
    if (i) {
      const g = Math.min(.3, p.t - points[i - 1].t - .16);
      tl.to(el, { x: p.x, y: p.y, duration: g, ease: 'move' }, T(p.t - g - .02));
    }
    tl.to(el, { scale: .8 * s, duration: .1, ease: press }, T(p.t));
    tl.to(el, { scale: s, duration: .22, ease: settle }, T(p.t + .1));
    tl.fromTo(rip, { x: p.x, y: p.y, scale: .7 * s, opacity: .9 }, { scale: 2.3 * s, opacity: 0, duration: .48, ease: 'power2.out', immediateRender: false }, T(p.t + .07));
  });
  if (leave) tl.to(el, { opacity: 0, scale: 1.15 * s, duration: .28, ease: 'power1.out' }, T(points[points.length - 1].t + .24));
}

function build() {
  const g = $('#glyph');

  $('#gStroke').setAttribute('stroke-width', (bb.width + 2 * pad) / 270 * 3.6);

  gsap.set(chips.map((c) => c.el), { x: 540, y: 640, scale: .3, autoAlpha: 0 });
  gsap.set('#rigWrap', { x: RIG_A.x, y: RIG_A.y, scale: RIG_A.s });
  gsap.set(['#pgLedger', '#lR'], { autoAlpha: 0 });
  gsap.set('#lB', { y: -ROW.h });
  gsap.set(['#notif', '#chip5', '#cta', '#cta2', '#url', '#fine'], { autoAlpha: 0 });
  gsap.set('#wall', { transformOrigin: `${LC.x}px ${LC.y}px` });
  gsap.set(['#pill', '#steps', '#chip5', '#cta', '#cta2'], { xPercent: -50 });
  gsap.set('#ipWrap', { x: IP_X, y: 1420, scale: IP_S });
  const measure = (els, extra) => els.map((p) => { p.style.position = 'static'; p.style.display = 'inline-flex'; const w = p.offsetWidth + extra; p.removeAttribute('style'); return w; });
  const pws = $$('#pill .pw'), widths = measure(pws, 104);
  const sts = $$('#steps .st'), stW = measure(sts, 56);
  gsap.set(pws, { yPercent: 102 });
  gsap.set(sts, { yPercent: 102 });
  gsap.set('#pill', { width: widths[0] });
  gsap.set('#steps', { width: stW[0] });

  // the clock drives everything procedural (the chips' idle float) so a seek lands on the same frame every time
  tl.to(clock, { t: DURATION + PRE, duration: DURATION + PRE, ease: 'none', onUpdate: tick }, 0);

  // ── 1 · hook: the question lands, and the places money hides float out from behind it
  tl.fromTo(h1, { yPercent: 165, rotation: 7 }, { yPercent: 0, rotation: 0, duration: 1, ease: 'enter', stagger: .08 }, T(-.5));
  tl.fromTo('#h1', { '--fs': 72 }, { '--fs': 100, duration: 1.3, ease: settle }, T(-.5));
  tl.fromTo('#h1', { scale: 1 }, { scale: 1.035, duration: 2.45, ease: 'none' }, T(-.5));
  chips.forEach((c) => tl.fromTo(c.el, { x: 540, y: 640, scale: .3, autoAlpha: 0 },
    { x: c.x, y: c.y, scale: c.s, autoAlpha: 1, duration: 1, ease: settle, immediateRender: false }, T(C.chipsOut + c.i * C.chipGap)));
  // two fingers pinch it all together — and it pours into one figure
  const byDist = [...chips].sort((a, b) => Math.hypot(b.x - 540, b.y - 640) - Math.hypot(a.x - 540, a.y - 640));
  byDist.forEach((c, k) => tl.to(c.el, { x: 540, y: 640, scale: c.s * .2, autoAlpha: 0, duration: .46, ease: 'power3.in' }, T(C.converge + k * .022)));
  tl.to(h1, { yPercent: -165, duration: .36, ease: 'exit', stagger: .035 }, T(C.h1Out));
  [['#t1', 250, 1070, 470, 700], ['#t2', 840, 250, 610, 585]].forEach(([el, x0, y0, x1, y1]) => {
    tl.fromTo(el, { x: x0 + 30, y: y0 + 50, scale: 1.3, opacity: 0 }, { x: x0, y: y0, scale: 1, opacity: 1, duration: .16, ease: settle, immediateRender: false }, T(C.pinch));
    tl.to(el, { x: x1, y: y1, scale: .86, duration: .44, ease: 'power2.in' }, T(C.converge));
    tl.to(el, { opacity: 0, scale: 1.2, duration: .22, ease: 'power1.out' }, T(C.converge + .44));
  });

  // ── 2 · the answer: a wall of digits, then the app's card
  tl.fromTo('#raw', { autoAlpha: 0, scale: .88 }, { autoAlpha: 1, scale: 1, duration: .6, ease: settle }, T(C.drop));
  $$('#raw .ds').forEach((s, i) => tl.fromTo(s, { y: 0 }, { y: -strips[i] * 150, duration: stripDur[i], ease: 'power3.out' }, T(C.drop)));
  tl.fromTo('#rawUnit', { autoAlpha: 0, y: 16 }, { autoAlpha: .75, y: 0, duration: .5, ease: settle }, T(2.4));
  [h2b, h2a].forEach((h) => tl.fromTo(h, { yPercent: 165 }, { yPercent: 0, duration: .85, ease: 'enter', stagger: .07 }, T(C.h2In)));
  tl.fromTo(['#h2b', '#h2a'], { '--fs': 80 }, { '--fs': 100, duration: 1, ease: settle }, T(C.h2In));
  tl.fromTo('#afterClip', { clipPath: 'inset(0px 0px 0px 1080px)' }, { clipPath: 'inset(0px 0px 0px 0px)', duration: C.scanDur, ease: 'power1.inOut' }, T(C.scan));
  tl.fromTo(['#beam', '#beamTrail'], { x: 1080 }, { x: 0, duration: C.scanDur, ease: 'power1.inOut' }, T(C.scan));
  tl.fromTo(['#beam', '#beamTrail'], { opacity: 0 }, { opacity: 1, duration: .12 }, T(C.scan - .02));
  tl.to(['#beam', '#beamTrail'], { opacity: 0, duration: .18 }, T(C.scan + C.scanDur - .08));
  tl.set('#s2b', { autoAlpha: 0 }, T(C.scan + 1.1));
  tl.fromTo(sub2, { yPercent: 165 }, { yPercent: 0, duration: .75, ease: 'enter', stagger: .05 }, T(C.sub2In));

  // the camera pulls out of the card and finds the phone around it
  tl.to(h2a, { yPercent: -165, duration: .38, ease: 'exit', stagger: .04 }, T(C.h2Out + .06));
  tl.to(sub2, { yPercent: -165, duration: .32, ease: 'exit', stagger: .02 }, T(C.h2Out - .02));
  tl.fromTo('#rigWrap', { x: RIG_A.x, y: RIG_A.y, scale: RIG_A.s }, { x: RIG_B.x, y: RIG_B.y, scale: RIG_B.s, duration: C.zoomDur, ease: 'cam', immediateRender: false }, T(C.zoom));
  tl.fromTo('#rig', { clipPath: clipCard }, { clipPath: clipFull, duration: C.zoomDur, ease: 'cam', immediateRender: false }, T(C.zoom));
  tl.fromTo('#rigShadow', { opacity: 0 }, { opacity: 1, duration: .6, ease: 'none' }, T(C.zoom + .25));

  // ── 3 · a bank SMS arrives; a tap on it, and it becomes a row of the ledger
  tl.fromTo(h3, { yPercent: 165 }, { yPercent: 0, duration: .85, ease: 'enter', stagger: .06 }, T(C.h3In));
  tl.fromTo('#h3', { '--fs': 80 }, { '--fs': 100, duration: 1, ease: settle }, T(C.h3In));
  tl.fromTo(sub3, { yPercent: 165 }, { yPercent: 0, duration: .75, ease: 'enter', stagger: .025 }, T(C.h3In + .26));
  tl.fromTo('#pgHome', { autoAlpha: 1 }, { autoAlpha: 0, duration: .14, ease: 'none', immediateRender: false }, T(C.tabSwap + .06));
  tl.fromTo('#pgLedger', { autoAlpha: 0, scale: .94 }, { autoAlpha: 1, scale: 1, duration: .42, ease: settle, immediateRender: false }, T(C.tabSwap + .14));
  tl.fromTo('#notif', { autoAlpha: 0, y: -64, scale: .94 }, { autoAlpha: 1, y: 0, scale: 1, duration: .6, ease: settle, immediateRender: false }, T(C.notif));
  $$('#notif .mk i').forEach((m, i) => tl.fromTo(m, { scaleX: 0 }, { scaleX: 1, duration: .36, ease: 'enter' }, T(C.marks[i])));
  tl.to('#notif', { scale: .98, duration: .1, ease: press }, T(C.notifTap));
  tl.to('#notif', { left: rowRect.x, top: rowRect.y, width: rowRect.w, height: rowRect.h, borderRadius: 0, scale: 1,
    boxShadow: 'rgba(0, 0, 0, 0) 0px 0px 0px 0px, rgba(0, 0, 0, 0) 0px 0px 0px 0px', duration: .6, ease: 'move', onUpdate: rowFit }, T(C.morph + .05));
  tl.to('#nContent', { autoAlpha: 0, duration: .14, ease: 'none' }, T(C.morph + .05));
  tl.fromTo('#nRow', { opacity: 0 }, { opacity: 1, duration: .3, ease: 'none' }, T(C.morph + .15));
  tl.fromTo('#lB', { y: -ROW.h }, { y: 0, duration: .55, ease: settle, immediateRender: false }, T(C.morph + .15));
  tl.set('#lR', { autoAlpha: 1 }, T(C.land));
  tl.set('#notif', { autoAlpha: 0 }, T(C.land));
  tl.fromTo('#lRflash', { opacity: .5 }, { opacity: 0, duration: .7, ease: 'power1.out', immediateRender: false }, T(C.land));
  gesture([{ t: C.notifTap, x: 610, y: 600 }]);

  // ── 4 · the phone steps back into a wall of every screen the app has
  tl.to(h3, { yPercent: -165, duration: .34, ease: 'exit', stagger: .03 }, T(C.h3Out));
  tl.to(sub3, { yPercent: -165, duration: .3, ease: 'exit', stagger: .01 }, T(C.h3Out));
  tl.to(['#rig .bezel', '#rigShadow'], { opacity: 0, duration: .2, ease: 'none' }, T(C.wall - .26));
  tl.set('#rigWrap', { autoAlpha: 0 }, T(C.wall));
  tl.set('#wallCam', { visibility: 'visible' }, T(C.wall));
  const S0 = (1080 * RIG_B.s) / TW;
  tl.fromTo('#wall', { x: screenC.x - LC.x, y: screenC.y - LC.y, scale: S0, rotationX: 0, rotationZ: 0 },
    { x: 430 - LC.x, y: 520 - LC.y, scale: .8, rotationX: 30, rotationZ: -13, duration: 1.05, ease: 'cam', immediateRender: false }, T(C.wall));
  Object.values(tiles).filter((t) => t !== L).forEach((t) => {
    const d = Math.hypot(t.c - L.c, t.r - L.r);
    tl.fromTo(t.el, { autoAlpha: 0, z: -600 }, { autoAlpha: 1, z: 0, duration: .6, ease: settle }, T(C.wall + .05 + d * .05));
  });
  tl.fromTo('#bright2', { clipPath: `circle(0px at ${screenC.x}px ${screenC.y}px)` }, { clipPath: `circle(1500px at ${screenC.x}px ${screenC.y}px)`, duration: .75, ease: 'power2.inOut' }, T(C.wall + .05));
  cols.forEach((c, i) => tl.fromTo(c, { y: 0 }, { y: (i % 2 ? 1 : -1) * 110, duration: 3.5, ease: 'none', immediateRender: false }, T(C.wall)));

  // one word at a time; a tap on its screen pulls it forward
  const beats = C.words;
  tl.set('#pill', { visibility: 'visible' }, T(beats[0] - .1));
  tl.fromTo('#pill', { scale: .8, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: .5, ease: settle, immediateRender: false }, T(beats[0] - .1));
  const others = Object.values(tiles).filter((t) => t !== tiles[CONFIG.focus[0]]).map((t) => $('.dim', t.el));
  tl.to(others, { opacity: .42, duration: .4, ease: 'none' }, T(beats[0]));
  beats.forEach((b, k) => {
    const f = tiles[CONFIG.focus[k]];
    tl.fromTo(pws[k], { yPercent: 102 }, { yPercent: 0, duration: .42, ease: k ? 'power3.inOut' : 'enter', immediateRender: false }, T(k ? b - .06 : b));
    tl.fromTo(pws[k], { '--fs': 74 }, { '--fs': 100, duration: .7, ease: settle, immediateRender: false }, T(b));
    if (k) {
      tl.to(pws[k - 1], { yPercent: -102, duration: .42, ease: 'power3.inOut' }, T(b - .06));
      tl.to('#pill', { width: widths[k], duration: .5, ease: settle }, T(b));
      const p = tiles[CONFIG.focus[k - 1]];
      tl.to(p.el, { z: 0, scale: 1, duration: .45, ease: settle }, T(b));
      tl.to($('.dim', p.el), { opacity: .42, duration: .3, ease: 'none' }, T(b));
    }
    tl.fromTo(f.el, { z: 0, scale: 1 }, { z: 230, scale: 1.1, duration: .55, ease: settle, immediateRender: false }, T(b + .04));
    tl.to($('.dim', f.el), { opacity: 0, duration: .25, ease: 'none' }, T(b + .04));
  });

  // ── 5 · iPhone: the same app, installed from the browser in three steps
  tl.set('#s6', { visibility: 'visible' }, T(C.toIphone));
  tl.set(['#wallCam', '#pill'], { visibility: 'hidden' }, T(C.toIphone + .62));
  tl.fromTo(h6, { yPercent: 165 }, { yPercent: 0, duration: .85, ease: 'enter', stagger: .06 }, T(C.h6In));
  tl.fromTo('#h6', { '--fs': 80 }, { '--fs': 100, duration: 1, ease: settle }, T(C.h6In));
  tl.fromTo('#ipWrap', { y: 1420 }, { y: IP_Y, duration: .75, ease: settle, immediateRender: false }, T(C.ipIn));
  tl.set('#steps', { visibility: 'visible' }, T(C.stepAt[0] - .05));
  tl.fromTo('#steps', { scale: .85, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: .45, ease: settle, immediateRender: false }, T(C.stepAt[0] - .05));
  C.stepAt.forEach((b, k) => {
    tl.fromTo(sts[k], { yPercent: 102 }, { yPercent: 0, duration: .42, ease: k ? 'power3.inOut' : 'enter', immediateRender: false }, T(k ? b - .06 : b));
    if (k) {
      tl.to(sts[k - 1], { yPercent: -102, duration: .42, ease: 'power3.inOut' }, T(b - .06));
      tl.to('#steps', { width: stW[k], duration: .45, ease: settle }, T(b));
    }
  });
  tl.fromTo('#ipSheet', { y: 1800 }, { y: 0, duration: .42, ease: settle, immediateRender: false }, T(C.sheetUp));
  tl.fromTo('#actHome i', { opacity: 0 }, { opacity: 1, duration: .06, ease: 'none', immediateRender: false }, T(C.addTap));
  tl.to('#actHome i', { opacity: 0, duration: .3, ease: 'none' }, T(C.addTap + .2));
  tl.fromTo('#ipDialog', { y: 2500 }, { y: 0, duration: .42, ease: settle, immediateRender: false }, T(C.dialogUp));
  tl.fromTo('#dAdd', { opacity: 1 }, { opacity: .35, duration: .06, ease: 'none', immediateRender: false }, T(C.confirmTap));
  tl.to('#dAdd', { opacity: 1, duration: .2, ease: 'none' }, T(C.confirmTap + .12));
  // home: Safari shrinks away under the swipe, and the icon it added is waiting
  tl.to(['#ipDialog', '#ipSheet'], { y: '+=2600', duration: .3, ease: 'power2.in' }, T(C.swipe - .06));
  tl.to('#ipSafari', { scale: .6, y: -120, autoAlpha: 0, borderRadius: 165, transformOrigin: '50% 90%', duration: .36, ease: 'power2.in' }, T(C.swipe));
  tl.fromTo('#ipHome', { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: .4, ease: settle, immediateRender: false }, T(C.home));
  tl.fromTo('#myIcon', { scale: 0, autoAlpha: 0 }, { scale: 1, autoAlpha: 1, duration: .5, ease: settle, immediateRender: false }, T(C.iconPop));
  const ic = ip(ICON.x + 90, ICON.y + 90);
  tl.fromTo('#r2', { x: ic.x, y: ic.y, scale: .6, opacity: .95 }, { scale: 1.9, opacity: 0, duration: .7, ease: 'power2.out', immediateRender: false }, T(C.iconPop + .12));
  tl.fromTo('#homebar', { y: 0 }, { y: -40, duration: .16, ease: 'power2.out', immediateRender: false }, T(C.swipe));
  tl.to('#homebar', { y: 0, duration: .25, ease: settle }, T(C.swipe + .2));
  // the app opens out of its icon
  tl.set('#ipApp', { visibility: 'visible' }, T(C.appOpen));
  tl.fromTo('#ipApp', { clipPath: `inset(${ICON.y}px ${1179 - ICON.x - ICON.s}px ${2556 - ICON.y - ICON.s}px ${ICON.x}px round 41px)` },
    { clipPath: 'inset(0px 0px 0px 0px round 165px)', duration: .5, ease: 'cam', immediateRender: false }, T(C.appOpen));
  tl.fromTo('#ipApp .ipPage', { scale: .55, transformOrigin: `${ICON.x + 90}px ${ICON.y - 87}px` }, { scale: 1, duration: .5, ease: 'cam', immediateRender: false }, T(C.appOpen));
  tl.fromTo('#ipAppIcon', { opacity: 1 }, { opacity: 0, duration: .22, ease: 'none', immediateRender: false }, T(C.appOpen + .06));
  gesture([
    { t: C.shareTap, ...ip(589.5, 2416) },
    { t: C.addTap, ...ip(430, 760 + 300 + 3 * 156 + 78) },
    { t: C.confirmTap, ...ip(1060, 120 + 40 + 45) },
  ], { s: .55, leave: false });
  // …then down to the bar, and the swipe home
  const sw0 = ip(589.5, 2520), sw1 = ip(589.5, 1880);
  tl.to('#t1', { x: sw0.x, y: sw0.y, duration: .1, ease: 'move' }, T(C.swipe - .1));
  tl.to('#t1', { y: sw1.y, duration: .26, ease: 'power2.in' }, T(C.swipe));
  tl.to('#t1', { opacity: 0, duration: .12, ease: 'none' }, T(C.swipe + .2));
  gesture([{ t: C.iconTap, ...ip(ICON.x + 90, ICON.y + 90) }], { s: .55 });

  // ── 6 · the brand fills the frame
  const ipC = ip(590, 1278);
  tl.fromTo('#endGround', { clipPath: `circle(0px at ${ipC.x}px ${ipC.y}px)` }, { clipPath: `circle(1200px at ${ipC.x}px ${ipC.y}px)`, duration: .62, ease: 'cam' }, T(C.toEnd));
  tl.fromTo('#glyph', { scale: .84 }, { scale: 1, duration: 1.1, ease: settle, immediateRender: false }, T(C.logo - .02));
  tl.fromTo('#gStroke', { drawSVG: '0%' }, { drawSVG: '100%', duration: .85, ease: 'power2.inOut' }, T(C.logo - .02));
  tl.fromTo('#gFill', { opacity: 0 }, { opacity: 1, duration: .38, ease: 'none', immediateRender: false }, T(C.logo + .5));
  tl.to('#gStroke', { opacity: 0, duration: .3, ease: 'none' }, T(C.logo + .74));
  tl.fromTo(wm, { yPercent: 165 }, { yPercent: 0, duration: .85, ease: 'enter', stagger: .08 }, T(C.wordmark));
  tl.fromTo('#wordmark', { '--fs': 78 }, { '--fs': 100, duration: 1.1, ease: settle }, T(C.wordmark));
  tl.fromTo('#s5', { scale: 1 }, { scale: 1.02, duration: DURATION - C.logo + PRE, ease: 'none', immediateRender: false }, T(C.logo));
  tl.fromTo('#chip5', { autoAlpha: 0, y: 24 }, { autoAlpha: 1, y: 0, duration: .6, ease: settle, immediateRender: false }, T(C.chip));
  tl.fromTo('#cta', { autoAlpha: 0, scale: .88 }, { autoAlpha: 1, scale: 1, duration: .6, ease: settle, immediateRender: false }, T(C.ctas[0]));
  tl.fromTo('#cta2', { autoAlpha: 0, scale: .88 }, { autoAlpha: 1, scale: 1, duration: .6, ease: settle, immediateRender: false }, T(C.ctas[1]));
  tl.fromTo(['#url', '#fine'], { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: .6, ease: settle, stagger: .08, immediateRender: false }, T(C.url));
  ['#cta', '#cta2'].forEach((id, k) => {
    tl.to(id, { scale: .97, duration: .12, ease: press }, T(C.ctaTaps[k]));
    tl.to(id, { scale: 1, duration: .3, ease: settle }, T(C.ctaTaps[k] + .14));
  });
}

// taps that need measured geometry (the wall's projection, the end card's buttons) go in after a seek
function placeTaps() {
  const at = (t, fn) => { tl.seek(T(t), true); return fn(); };
  const centre = (el, fx = .5, fy = .5) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width * fx, y: r.top + r.height * fy }; };
  const wallTaps = C.words.map((b, k) => ({ t: b, ...at(b + .12, () => centre(tiles[CONFIG.focus[k]].el, .5, .55)) }));
  const ends = C.ctaTaps.map((b, k) => ({ t: b, ...at(b, () => centre($(k ? '#cta2' : '#cta'), .64, .6)) }));
  tl.seek(0, true);
  gesture(wallTaps);
  gesture(ends);
  // leaving the wall: the family screen opens into the iPhone scene
  const f = wallTaps[3], R = Math.max(...[[0, 0], [1080, 0], [0, 1350], [1080, 1350]].map(([x, y]) => Math.hypot(x - f.x, y - f.y))) + 80;
  tl.fromTo('#ipGround', { clipPath: `circle(0px at ${f.x}px ${f.y}px)` }, { clipPath: `circle(${R}px at ${f.x}px ${f.y}px)`, duration: .62, ease: 'cam' }, T(C.toIphone));
  window.CUES.pan = { wall: wallTaps.map((p) => p.x / 540 - 1), ends: ends.map((p) => p.x / 540 - 1) };
}

// the row inside the shrinking notification stays centred on «قبض برق», whatever the box's shape
function rowFit() {
  const n = $('#notif');
  $('#nRow img').style.top = n.offsetHeight / 2 - (130 + ROW.y + ROW.h / 2) * n.offsetWidth / 1080 + 'px';
}

function tick() {
  const t = clock.t - PRE;
  for (const c of chips) {
    const a = 11 * c.s, ph = c.i * 1.7;
    c.cf.style.transform = `translate(${a * Math.sin(t * 1.25 + ph)}px, ${a * Math.cos(t * 1.05 + ph * 1.3)}px) rotate(${2.4 * Math.sin(t * .9 + ph)}deg)`;
  }
}

window.DURATION = DURATION;
window.CUES = { ...C, duration: DURATION, strips, stripDur, chipX: chips.map((c) => c.x / 540 - 1) };
window.seek = (t) => { tl.seek(T(t), false); };
window.ready = (async () => {
  // XHR, not fetch: fetch refuses file:// even where --allow-file-access-from-files lets XHR in
  const svg = await new Promise((ok, no) => { const x = new XMLHttpRequest(); x.onload = () => ok(x.responseText); x.onerror = no; x.open('GET', '../../worker/public/icon.svg'); x.send(); });
  GLYPH_D = svg.match(/ d="([^"]+)"/)[1];
  await document.fonts.load('900 100px Modam');
  await document.fonts.load('300 100px Modam');
  await document.fonts.load('700 36px Inter');
  await document.fonts.ready;
  await Promise.all($$('img').map((i) => i.decode().catch(() => {})));
  build();
  placeTaps();
  tl.seek(T(0), false);
  if (!/render/.test(location.search)) { tl.play(); tl.eventCallback('onComplete', () => tl.seek(T(0)).play()); }
  return true;
})();
</script>
